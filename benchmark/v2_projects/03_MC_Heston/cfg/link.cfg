# v++ link configuration: 1 CU with MC_LANES (default 6) interleaved lanes (see README section 3).
# Each m_axi bundle has its own HBM bank. Buffers are tiny (384 B in, 64 B out).
[connectivity]
nk=mc_heston_v2:1:mc_heston_v2_1
sp=mc_heston_v2_1.fpar:HBM[0]
sp=mc_heston_v2_1.out:HBM[1]


[vivado]
# retiming helps the float-IP chains; strategy is set by fpga_flow.mk (STRATEGY=Performance_Explore)
prop=run.synth_1.{STEPS.SYNTH_DESIGN.ARGS.MORE OPTIONS}={-retiming}
