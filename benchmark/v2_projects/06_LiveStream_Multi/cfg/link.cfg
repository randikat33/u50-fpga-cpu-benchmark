# v++ link configuration - 06 LiveStream Multi (v2)
# One CU holds the whole 5-rung ladder (5 resizers in dataflow). The 5 write masters all
# map to the same bank so the host allocates ONE output BO and does one D2H per call.
# cfg/link_2cu.cfg is the CU-scaling ablation (make xclbin NCU=2).
[connectivity]
nk=lm_ladder:1:lm_ladder_1
sp=lm_ladder_1.src:HBM[0]
sp=lm_ladder_1.o0:HBM[1]
sp=lm_ladder_1.o1:HBM[1]
sp=lm_ladder_1.o2:HBM[1]
sp=lm_ladder_1.o3:HBM[1]
sp=lm_ladder_1.o4:HBM[1]


[vivado]
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
