# v++ link configuration: 1 CU with AS_LANES (default 16) interleaved lanes.
# Each m_axi bundle has its own HBM bank. Buffers are tiny (64 B in, 64 B out).
[connectivity]
nk=mc_asian:1:mc_asian_1
sp=mc_asian_1.fpar:HBM[0]
sp=mc_asian_1.out:HBM[1]

[vivado]
# retiming helps the float-IP chains; strategy is set by fpga_flow.mk (STRATEGY=Performance_Explore)
prop=run.synth_1.{STEPS.SYNTH_DESIGN.ARGS.MORE OPTIONS}={-retiming}
