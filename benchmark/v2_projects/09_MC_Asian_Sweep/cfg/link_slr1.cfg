# v++ link configuration: as link.cfg, with the compute unit placed in SLR1, away from the HBM
# controllers and the platform shell in SLR0 (reduces congestion around the platform clocks).
[connectivity]
nk=mc_asian:1:mc_asian_1
slr=mc_asian_1:SLR1
sp=mc_asian_1.fpar:HBM[0]
sp=mc_asian_1.out:HBM[1]

[vivado]
prop=run.synth_1.{STEPS.SYNTH_DESIGN.ARGS.MORE OPTIONS}={-retiming}
