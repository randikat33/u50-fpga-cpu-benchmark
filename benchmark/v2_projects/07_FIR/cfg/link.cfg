# v++ link configuration - int16 FIR v2 (Alveo U50, xilinx_u50_gen3x16_xdma_5_202210_1)
# 2 CUs, as for AES: one CU (16 samples/cycle = 9.6 GB/s in and out at 300 MHz) is close to the
# PCIe link, the second lets chunk k+1 upload while chunk k is computed/downloaded.
# Each data bundle gets two HBM pseudo-channels (512 MiB), so a 256 MiB chunk plus its history fits.
[connectivity]
nk=fir_v2:2:fir_v2_1.fir_v2_2
sp=fir_v2_1.src:HBM[0:1]
sp=fir_v2_1.dst:HBM[2:3]
sp=fir_v2_1.coef:HBM[4]
sp=fir_v2_2.src:HBM[5:6]
sp=fir_v2_2.dst:HBM[7:8]
sp=fir_v2_2.coef:HBM[9]

[vivado]
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
