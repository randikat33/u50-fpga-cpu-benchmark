# v++ link configuration - v2 3x3 convolution, Alveo U50 (xilinx_u50_gen3x16_xdma_5_202210_1)
# One xclbin with the three variants (no bitstream swap between runs), one CU each.
# Every m_axi bundle has its own HBM bank (12 of HBM[0..31] used).
# Why 1 CU per variant: one CU already processes 64 bytes/cycle = 19.2 GB/s of input
# (57.6 GB/s of output) at 300 MHz, far above the ~12 GB/s PCIe Gen3 x16 roofline
# (see README section 3). For a CU-scaling ablation use cfg/link_2cu.cfg (make NCU=2).
[connectivity]
nk=conv3_rgb16:1:conv3_rgb16_1
nk=conv3_rgb8:1:conv3_rgb8_1
nk=conv3_gray8:1:conv3_gray8_1

sp=conv3_rgb16_1.img_in:HBM[0]
sp=conv3_rgb16_1.out_sharpen:HBM[1]
sp=conv3_rgb16_1.out_edge:HBM[2]
sp=conv3_rgb16_1.out_blur:HBM[3]
sp=conv3_rgb8_1.img_in:HBM[4]
sp=conv3_rgb8_1.out_sharpen:HBM[5]
sp=conv3_rgb8_1.out_edge:HBM[6]
sp=conv3_rgb8_1.out_blur:HBM[7]
sp=conv3_gray8_1.img_in:HBM[8]
sp=conv3_gray8_1.out_sharpen:HBM[9]
sp=conv3_gray8_1.out_edge:HBM[10]
sp=conv3_gray8_1.out_blur:HBM[11]

# HBM and the shell live in SLR0: keep the kernels next to them
slr=conv3_rgb16_1:SLR0
slr=conv3_rgb8_1:SLR0
slr=conv3_gray8_1:SLR0


[vivado]
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=ExtraNetDelay_high
