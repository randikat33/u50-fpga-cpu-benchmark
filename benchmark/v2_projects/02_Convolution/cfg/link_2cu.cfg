sp=conv3_rgb16_2.out_edge:HBM[6]
sp=conv3_rgb16_2.out_blur:HBM[7]
sp=conv3_rgb8_1.img_in:HBM[8]
sp=conv3_rgb8_1.out_sharpen:HBM[9]
sp=conv3_rgb8_1.out_edge:HBM[10]
sp=conv3_rgb8_1.out_blur:HBM[11]
