sp=conv3_rgb16_1.img_in:HBM[0]
sp=conv3_rgb16_1.out_sharpen:HBM[1]
sp=conv3_rgb16_1.out_edge:HBM[2]
sp=conv3_rgb16_1.out_blur:HBM[3]
sp=conv3_rgb16_2.img_in:HBM[4]
