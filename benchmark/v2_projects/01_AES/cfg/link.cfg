# v++ link configuration - AES-256-CTR v2 (Alveo U50, xilinx_u50_gen3x16_xdma_5_202210_1)
# 2 CUs: one CU (19.2 GB/s at 300 MHz) already exceeds PCIe Gen3 x16 (~12 GB/s); the
# second CU lets chunk k+1 upload while chunk k is computed/downloaded (host pipelining).
# Each CU uses ~46k LUT (6.5 % of the user budget); see README section 3.
[connectivity]
nk=aes256ctr:2:aes256ctr_1.aes256ctr_2
# one HBM bank per m_axi bundle (argument names src/dst/prm)
sp=aes256ctr_1.src:HBM[0]
sp=aes256ctr_1.dst:HBM[1]
sp=aes256ctr_1.prm:HBM[2]
sp=aes256ctr_2.src:HBM[3]
sp=aes256ctr_2.dst:HBM[4]
sp=aes256ctr_2.prm:HBM[5]

# Kernel clock: platform default clock id 0 = 300 MHz (clk_kernel_00), used by both CUs.
# To request a different frequency for a CU instead, use e.g.:
# [clock]
# freqHz=250000000:aes256ctr_1.ap_clk
# freqHz=250000000:aes256ctr_2.ap_clk

[vivado]
# the kernel registers are placed by hand in C++; let phys_opt replicate high-fanout nets
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
