# v++ link configuration - 05 LiveStream Single (v2)
# 2 CUs: the pipeline is decode/encode-bound (see README section 3), so a third CU adds
# routing congestion (v1: 6 CUs, WNS -2.12 ns on the kernel clock and -0.73 ns on the HBM
# clock) without adding frames per second. Use cfg/link_4cu.cfg for the CU-scaling ablation.
[connectivity]
nk=ls_resize:2:ls_resize_1.ls_resize_2
sp=ls_resize_1.src:HBM[0]
sp=ls_resize_1.dst:HBM[1]
sp=ls_resize_2.src:HBM[2]
sp=ls_resize_2.dst:HBM[3]


[vivado]
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
