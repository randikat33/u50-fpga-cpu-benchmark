# Used for the extra PROFILED run only (PCIe/HBM bandwidth, kernel and API tables).
# Tracing adds overhead, so these runs are excluded from all timing statistics.
[Debug]
profile=true
opencl_trace=true
native_xrt_trace=true
timeline_trace=true
data_transfer_trace=fine
device_trace=fine
device_counters=true
power_profile=true
power_profile_interval_ms=20
trace_buffer_size=64M
continuous_trace=true
