# v++ link configuration (protocol v0.5 secondary case): 2 CUs, one per SLR, as for the main kernels.
# Lanes per CU are set by LANES at HLS time.
# The m_axi buffers are tiny (at most 192 B in, 256 B out); each CU has its own two HBM banks.
[connectivity]
nk=hb_ft:2:hb_ft_1.hb_ft_2
slr=hb_ft_1:SLR0
slr=hb_ft_2:SLR1
sp=hb_ft_1.fpar:HBM[0]
sp=hb_ft_1.out:HBM[1]
sp=hb_ft_2.fpar:HBM[2]
sp=hb_ft_2.out:HBM[3]

[vivado]
prop=run.synth_1.{STEPS.SYNTH_DESIGN.ARGS.MORE OPTIONS}={-retiming}
