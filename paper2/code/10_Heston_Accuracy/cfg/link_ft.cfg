# v++ link configuration: 2 CUs of hq_ft, one per SLR (a CU with all lanes would not fit one SLR:
# HLS estimate per lane in phase 3, step 1). Lanes per CU are set by LANES at HLS time.
# The m_axi buffers are tiny (128 B in, 112 B out); each CU has its own two HBM banks.
[connectivity]
nk=hq_ft:2:hq_ft_1.hq_ft_2
slr=hq_ft_1:SLR0
slr=hq_ft_2:SLR1
sp=hq_ft_1.fpar:HBM[0]
sp=hq_ft_1.out:HBM[1]
sp=hq_ft_2.fpar:HBM[2]
sp=hq_ft_2.out:HBM[3]

[vivado]
prop=run.synth_1.{STEPS.SYNTH_DESIGN.ARGS.MORE OPTIONS}={-retiming}
